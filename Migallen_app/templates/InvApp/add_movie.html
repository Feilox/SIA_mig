<!DOCTYPE html>
<html>
<head>
    <title>Add Movie</title>

    <style>
        body {
            background: #160b35;
            color: white;
            font-family: Arial;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: 60px auto;
            background: #241653;
            padding: 35px;
            border-radius: 20px;
        }

        h1 {
            color: #ff4fc3;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }

        button {
            background: #ff3fb4;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 Add Movie</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Add Movie
        </button>

    </form>

</div>

</body>
</html>
