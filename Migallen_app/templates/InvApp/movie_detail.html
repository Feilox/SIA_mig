<!DOCTYPE html>
<html>
<head>
    <title>{{ movie.title }}</title>

    <style>
        body {
            margin: 0;
            background: #160b35;
            color: white;
            font-family: Arial;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 80px auto;
            background: #241653;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            color: #ff4fc3;
            font-size: 40px;
        }

        .rating {
            color: #ffd43b;
            font-size: 22px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            background: #6331bb;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 {{ movie.title }}</h1>

    <p><strong>Genre:</strong> {{ movie.genre }}</p>

    <p><strong>Release Year:</strong> {{ movie.release_year }}</p>

    <p><strong>Director:</strong> {{ movie.director }}</p>

    <p class="rating">
        ⭐ {{ movie.rating }}
    </p>

    <p>
        {{ movie.description }}
    </p>

    <a href="/movies/" class="back">
        ← Back to Movies
    </a>

</div>

</body>
</html>
