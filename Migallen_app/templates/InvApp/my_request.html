<!DOCTYPE html>
<html>

<head>

    <title>My Requests</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background:#e0f2fe; padding:40px;">

<div class="container">

    <div class="card shadow border-0 rounded-4">

        <div class="card-header text-white"
             style="background:linear-gradient(135deg,#075985,#047857);">

            <h3 class="mb-0">
                📋 My Requests
            </h3>

        </div>

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Request Type</th>
                        <th>Description</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

                    {% for request in requests %}

                    <tr>

                        <td>
                            #{{ request.request_id }}
                        </td>

                        <td>
                            {{ request.request_type }}
                        </td>

                        <td>
                            {{ request.description }}
                        </td>

                        <td>
                            {{ request.date_requested|date:"M d, Y" }}
                        </td>

                        <td>

                            <span class="badge
                            {% if request.status == 'Pending' %}
                                bg-warning text-dark
                            {% elif request.status == 'Completed' %}
                                bg-success
                            {% elif request.status == 'Processing' %}
                                bg-primary
                            {% else %}
                                bg-danger
                            {% endif %}">

                                {{ request.status }}

                            </span>

                        </td>

                    </tr>

                    {% empty %}

                    <tr>

                        <td colspan="5"
                            class="text-center">

                            No requests submitted.

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
